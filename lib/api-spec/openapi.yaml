              items:
                $ref: "#/components/schemas/AllocationCandidate"
          required: [candidates]

    AllocationCandidate:
      type: object
      properties:
        id:
          type: string
        allocationId:
          type: string
        userId:
          type: string
        userName:
          type: string
          nullable: true
        rank:
          type: integer
        eligible:
          type: boolean
        compatible:
          type: boolean
        priorityScore:
          type: integer
        rejectionReason:
          type: string
          nullable: true
        candidateData:
          type: object
          nullable: true
        createdAt:
          type: string
      required: [id, allocationId, userId, rank, eligible, compatible, priorityScore, createdAt]

    AllocationException:
      type: object
      properties:
        id:
          type: string
        scaleId:
          type: string
        agendaEventId:
          type: string
          nullable: true
        positionId:
          type: string
          nullable: true
        positionName:
          type: string
          nullable: true
        type:
          type: string
          enum: [NO_CANDIDATE, RESTRICTION, CONFLICT, INSUFFICIENT_COVERAGE, SUPERVISOR_OVERRIDE]
        reason:
          type: string
        impact:
          type: string
          nullable: true
        candidatesAnalyzed:
          type: array
          items:
            type: object
        resolvedBy:
          type: string
          nullable: true
        resolvedAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, scaleId, type, reason, createdAt]

    MyAllocation:
      type: object
      properties:
        id:
          type: string
        scaleId:
          type: string
        agendaEventId:
          type: string
        positionId:
          type: string
          nullable: true
        positionName:
          type: string
          nullable: true
        status:
          type: string
          enum: [ASSIGNED, OPEN, CONFLICT, MANUAL_OVERRIDE]
        eventTitle:
          type: string
          nullable: true
        eventDate:
          type: string
          nullable: true
        eventStartTime:
          type: string
          nullable: true
        eventEndTime:
          type: string
          nullable: true
        eventLocation:
          type: string
          nullable: true
        eventType:
          type: string
          nullable: true
        scaleTitle:
          type: string
          nullable: true
        scaleStatus:
          type: string
          nullable: true
      required: [id, scaleId, agendaEventId, status]

    EngineResult:
      type: object
      properties:
        totalPositions:
          type: integer
        assignedPositions:
          type: integer
        openPositions:
          type: integer
        conflictPositions:
          type: integer
      required: [totalPositions, assignedPositions, openPositions, conflictPositions]

    ScaleGenerateRequest:
      type: object
      properties:
        agendaEventId:
          type: string
        showBookId:
          type: string
        operationId:
          type: string
        groupId:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
      required: [agendaEventId, showBookId, operationId]

    AllocationOverrideRequest:
      type: object
      properties:
        userId:
          type: string
        reason:
          type: string
        notes:
          type: string
          nullable: true
      required: [userId, reason]

    ScalePatchRequest:
      type: object
      properties:
        title:
          type: string
