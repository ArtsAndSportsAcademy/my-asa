          description: Escala republicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  scale:
                    $ref: "#/components/schemas/ScaleSummary"
                required: [scale]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /scales/{id}/archive:
    post:
      operationId: archiveScale
      tags: [scales]
      summary: "Arquivar escala"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Escala arquivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  scale:
                    $ref: "#/components/schemas/ScaleSummary"
                required: [scale]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /scales/{id}/allocations:
    get:
      operationId: listScaleAllocations
      tags: [scales]
      summary: "Listar alocações com candidatos"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Alocações da escala
          content:
            application/json:
              schema:
                type: object
                properties:
                  allocations:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScaleAllocationWithCandidates"
                required: [allocations]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /scales/{id}/allocations/{allocationId}:
    patch:
      operationId: overrideAllocation
      tags: [scales]
      summary: "Override manual de alocação (Supervisor)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: allocationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationOverrideRequest"
      responses:
        "200":
          description: Alocação substituída
          content:
            application/json:
              schema:
                type: object
                properties:
                  allocation:
                    $ref: "#/components/schemas/ScaleAllocation"
                required: [allocation]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /scales/{id}/exceptions:
    get:
      operationId: listScaleExceptions
      tags: [scales]
      summary: "Listar exceções da escala"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exceções da escala
          content:
            application/json:
              schema:
                type: object
                properties:
                  exceptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AllocationException"
                required: [exceptions]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /scales/{id}/exceptions/{exceptionId}/resolve:
    patch:
      operationId: resolveScaleException
      tags: [scales]
      summary: "Resolver exceção da escala"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: exceptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exceção resolvida
          content:
            application/json:
              schema:
                type: object
                properties:
                  exception:
                    $ref: "#/components/schemas/AllocationException"
                required: [exception]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        photoUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        organizationId:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, email, status, organizationId]

    UserRole:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        operationId:
          type: string
        groupId:
          type: string
          nullable: true
        role:
          type: string
          enum: [ADMIN, SUPERVISOR_A, SUPERVISOR_B, MEMBER]
        active:
          type: boolean
      required: [id, userId, operationId, role, active]

    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]

    Operation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        organizationId:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, PAUSED, ARCHIVED]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, organizationId, status]

    OperationalGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        operationId:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]
        supervisorId:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, operationId, status]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    LoginResult:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
      required: [accessToken, refreshToken, user, roles]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    TokensResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required: [accessToken, refreshToken]

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
        operationIds:
          type: array
          items:
            type: string
      required: [user, roles, operationIds]

    CurrentOrganization:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/OperationalGroup"
      required: [organization, operations, groups]

    UserContext:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
        organization:
          $ref: "#/components/schemas/Organization"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/OperationalGroup"
      required: [user, roles, organization, operations, groups]

    UserCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required: [name, email, password]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    UserStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
      required: [status]

    RoleCreate:
      type: object
      properties:
        operationId:
