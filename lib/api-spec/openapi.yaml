components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        photoUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        organizationId:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, email, status, organizationId]

    UserRole:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        operationId:
          type: string
        groupId:
          type: string
          nullable: true
        role:
          type: string
          enum: [ADMIN, SUPERVISOR_A, SUPERVISOR_B, MEMBER]
        active:
          type: boolean
      required: [id, userId, operationId, role, active]

    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]

    Operation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        organizationId:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, PAUSED, ARCHIVED]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, organizationId, status]

    OperationalGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        operationId:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]
        supervisorId:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, operationId, status]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    LoginResult:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
      required: [accessToken, refreshToken, user, roles]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    TokensResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required: [accessToken, refreshToken]

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
        operationIds:
          type: array
          items:
            type: string
      required: [user, roles, operationIds]

    CurrentOrganization:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/OperationalGroup"
      required: [organization, operations, groups]

    UserContext:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
        organization:
          $ref: "#/components/schemas/Organization"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/OperationalGroup"
      required: [user, roles, organization, operations, groups]

    UserCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required: [name, email, password]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    UserStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
      required: [status]

    RoleCreate:
      type: object
      properties:
        operationId:
          type: string
        groupId:
          type: string
          nullable: true
        role:
          type: string
          enum: [ADMIN, SUPERVISOR_A, SUPERVISOR_B, MEMBER]
      required: [operationId, role]

    OperationCreate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
