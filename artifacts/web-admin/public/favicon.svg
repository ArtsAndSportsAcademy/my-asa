<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fa" x1="130" y1="11" x2="32" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="55%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="fb" x1="140" y1="40" x2="36" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="fc" x1="144" y1="76" x2="40" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="36" fill="url(#bg)"/>

  <!-- Asinha scaled to fit: original viewBox 0 0 100 112, scaled ~1.45x and centered -->
  <!-- transform: scale(1.45) translate(9, 7) -->
  <g transform="translate(13, 10) scale(1.54)">
    <!-- Outer feather (back, largest) -->
    <path
      d="M 16,106 C 10,80 8,50 18,22 C 28,2 56,-2 76,10 C 62,18 46,34 36,58 C 28,76 22,92 16,106 Z"
      fill="url(#fa)"
      stroke="rgba(255,255,255,0.25)"
      stroke-width="1"
      stroke-linejoin="round"
    />
    <!-- Middle feather -->
    <path
      d="M 20,106 C 16,84 18,60 28,40 C 40,18 64,10 82,20 C 68,28 54,46 46,66 C 36,84 28,96 20,106 Z"
      fill="url(#fb)"
      stroke="rgba(255,255,255,0.25)"
      stroke-width="1"
      stroke-linejoin="round"
    />
    <!-- Inner feather (front, smallest) -->
    <path
      d="M 24,106 C 20,88 22,70 32,54 C 44,36 68,28 84,38 C 72,46 60,60 52,78 C 44,92 34,100 24,106 Z"
      fill="url(#fc)"
      stroke="rgba(255,255,255,0.25)"
      stroke-width="1"
      stroke-linejoin="round"
    />
  </g>
</svg>
