<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala simples — desenho de exemplo</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--tx2:#6e6e73;--tx3:#8e8e93;--line:#e5e5ea;
  --acc:#0a84ff;--acc-bg:#e8f2ff;
  --warn:#9a5200;--warn-bg:#fff3dc;--ok:#1c7d38;--ok-bg:#e3f5e9;--bad:#c4271c;--bad-bg:#fdebe9;
  --r:14px;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 120px}
@media(min-width:800px){.wrap{padding:0 28px 120px}}

/* topo + abas */
.top{position:sticky;top:0;z-index:10;background:rgba(245,245,247,.85);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
@media(min-width:800px){.top-in{padding:12px 28px}}
.brand{font-weight:700;letter-spacing:-.01em}
.seg{display:flex;background:#e9e9ee;border-radius:10px;padding:2px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--tx2);white-space:nowrap}
.seg button[aria-selected=true]{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .lg{display:none}
@media(min-width:700px){.seg .lg{display:inline}.seg .sm{display:none}.seg button{padding:6px 16px;font-size:14px}}
.demo{font-size:12px;color:var(--tx2);text-align:center;padding:14px 0 6px}

/* barra do dia */
.toolbar{display:grid;gap:10px 12px;align-items:center;grid-template-columns:1fr auto;grid-template-areas:"local pub" "date pill";margin:14px 0 14px}
@media(min-width:700px){.toolbar{grid-template-columns:auto auto 1fr auto auto;grid-template-areas:"local date . pill pub";margin:18px 0 16px}}
.pop-wrap{grid-area:local;position:relative;justify-self:start}
.btn-local{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:9px 14px;box-shadow:0 0 0 1px var(--line);font-size:16px}
.btn-local b{font-weight:600}
.btn-local .car{color:var(--tx3);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.pop{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:var(--card);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.16),0 0 0 1px var(--line);padding:6px;z-index:20}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px}
.pop button:hover{background:var(--bg)}
.pop button[aria-current=true]{font-weight:600}
.datenav{grid-area:date;display:flex;align-items:center;gap:2px}
.datenav button{width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--tx2);display:grid;place-items:center}
.datenav button:hover{background:#e9e9ee}
.datenav span{font-weight:600;min-width:128px;text-align:center;text-transform:capitalize}
.pill{grid-area:pill;justify-self:end;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.rasc{background:#ececf0;color:var(--tx2)}
.pill.pub{background:var(--ok-bg);color:var(--ok)}
.pill.alt{background:var(--warn-bg);color:var(--warn)}
.primary{grid-area:pub;background:var(--acc);color:#fff;font-weight:600;border-radius:99px;padding:9px 20px;justify-self:end;transition:opacity .15s}
.primary:hover{opacity:.9}
.primary[disabled]{background:#c7c7cc;cursor:default}
.nota{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}

/* resumo recolhido */
.resumo{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:11px 16px;font-size:14px;color:var(--tx2)}
.resumo .warn{color:var(--warn);font-weight:600}
.resumo .chev{margin-left:auto;transition:transform .2s;color:var(--tx3)}
.resumo[aria-expanded=true] .chev{transform:rotate(180deg)}
.resumo-body{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);margin-top:8px;padding:14px 16px;display:grid;gap:16px}
@media(min-width:700px){.resumo-body{grid-template-columns:1fr 1.4fr}}
.resumo-body h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin-bottom:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border-radius:99px;padding:4px 10px;font-size:13px}
.chip small{color:var(--tx3)}
.aten{list-style:none;padding:0;display:grid;gap:8px;font-size:14px}
.aten li{display:flex;gap:8px}
.aten li::before{content:"";width:6px;height:6px;border-radius:50%;background:#ff9f0a;margin-top:7px;flex:none}

/* lista por atividade */
.lhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 4px 8px;flex-wrap:wrap}
.lhead h2{font-size:13px;color:var(--tx2);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.row{display:grid;grid-template-columns:52px 4px minmax(0,1fr);gap:0 12px;align-items:center;width:100%;padding:10px 14px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row:hover{background:#fafafc}
.row[aria-pressed=true]{background:var(--acc-bg)}
.hora{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;line-height:1.25;font-variant-numeric:tabular-nums}
.hora b{font-weight:600;font-size:14px}
.hora small{color:var(--tx3);font-size:12px}
.bar{grid-column:2;grid-row:1/3;align-self:stretch;border-radius:3px;background:var(--c);min-height:34px}
.nm{grid-column:3;grid-row:1;font-weight:600;overflow-wrap:anywhere}
.quem{grid-column:3;grid-row:2;color:var(--tx2);font-size:13px;overflow-wrap:anywhere}
.quem.vazio{color:var(--bad)}
@media(min-width:700px){
  .row{grid-template-columns:96px 4px minmax(0,1fr) minmax(0,300px);gap:0 16px;padding:10px 20px}
  .hora,.bar{grid-row:1}.nm{grid-column:3;grid-row:1}.quem{grid-column:4;grid-row:1;text-align:right;font-size:14px}
}
.link{color:var(--acc);font-size:13px;font-weight:500}
.link:hover{text-decoration:underline}
.vazio-msg{padding:28px 20px;text-align:center;color:var(--tx2)}

/* por pessoa */
.pessoa{padding:12px 16px;border-top:1px solid var(--line)}
.pessoa:first-child{border-top:0}
.pessoa h3{font-size:15px;margin-bottom:8px}
.pessoa .acts{display:flex;flex-wrap:wrap;gap:6px}
.pessoa .acts button{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:6px 10px;font-size:13px}
.pessoa .acts .dot{width:8px;height:8px}
.pessoa .acts small{color:var(--tx3);font-variant-numeric:tabular-nums}

/* painel lateral / folha de baixo */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .22s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;z-index:31;top:0;right:0;bottom:0;width:390px;max-width:100%;background:var(--card);box-shadow:-10px 0 40px rgba(0,0,0,.14);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.panel.on{transform:none;visibility:visible}
@media(max-width:699px){
  .panel{top:auto;left:0;width:auto;max-height:88vh;border-radius:20px 20px 0 0;transform:translateY(105%);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
  .panel::before{content:"";width:38px;height:5px;border-radius:3px;background:#d1d1d6;margin:8px auto 0;flex:none}
}
.p-head{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 12px}
.p-head .bar{width:4px;min-height:40px;align-self:stretch;flex:none}
.p-head h3{font-size:19px;letter-spacing:-.01em;line-height:1.2}
.p-head p{color:var(--tx2);font-size:13px;margin-top:2px}
.x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#ececf0;display:grid;place-items:center;font-size:18px;color:var(--tx2);flex:none}
.p-body{overflow:auto;padding:4px 20px 16px;flex:1}
.p-body h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin:12px 0 8px;font-weight:600}
.pessoas{display:flex;flex-wrap:wrap;gap:6px}
.av{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border-radius:99px;padding:3px 11px 3px 3px;font-size:14px}
.av i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#fff;background:var(--c)}
.acoes{margin-top:8px;border-radius:12px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.acoes button{display:block;width:100%;padding:12px 16px;border-top:1px solid var(--line)}
.acoes button:first-child{border-top:0}
.acoes button:hover{background:#fafafc}
.acoes b{display:block;font-weight:500}
.acoes small{color:var(--tx3);font-size:12px}
.acoes .perigo b{color:var(--bad)}
.p-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.btn{padding:9px 18px;border-radius:99px;font-weight:600;background:#ececf0}
.btn.main{background:var(--acc);color:#fff}
.sel-list{display:flex;flex-wrap:wrap;gap:6px}
.sel-list button{background:var(--bg);border-radius:99px;padding:7px 13px;font-size:14px;border:1.5px solid transparent}
.sel-list button[aria-pressed=true]{background:var(--acc-bg);border-color:var(--acc);color:#0561c2;font-weight:600}
.horas{display:flex;gap:12px;flex-wrap:wrap}
.horas label{display:grid;gap:4px;font-size:13px;color:var(--tx2)}
.horas input{font:inherit;font-size:17px;padding:8px 10px;border-radius:10px;border:1px solid #d1d1d6;color:var(--tx);background:#fff;min-width:120px}
.dica{font-size:13px;color:var(--tx2);margin-top:12px}

/* títulos de seção */
.hd{margin:20px 0 14px}
.hd h2{font-size:22px;letter-spacing:-.02em}
.hd p{color:var(--tx2);font-size:14px;margin-top:2px}

/* semana */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.sem-head,.sem-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sem-head{padding:10px 10px 6px;font-size:11px;font-weight:600;color:var(--tx3);text-align:center}
.sem-head .esp{display:none}
.sem-head .hoje{color:var(--acc)}
.sem-row{padding:10px;border-top:1px solid var(--line)}
.sem-nome{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.sem-nome b{font-size:15px}
.cnt{font-size:12px;color:var(--tx2);background:var(--bg);padding:2px 9px;border-radius:99px}
.cnt.hi{background:var(--warn-bg);color:var(--warn);font-weight:600}
.cel{background:color-mix(in srgb,var(--c) 13%,#fff);box-shadow:inset 0 3px 0 var(--c);border-radius:8px;padding:7px 2px 5px;text-align:center;display:grid;gap:5px;align-content:center;min-height:46px;font-size:10px;line-height:1.15;min-width:0}
.cel .e{display:flex;flex-direction:column;align-items:center}
.cel .e b{font-weight:600}
.cel .e span{color:var(--tx2);font-variant-numeric:tabular-nums}
.cel.folga{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--tx3);align-content:center}
.cel.hojec{outline:2px solid var(--acc);outline-offset:-1px}
@media(min-width:800px){
  .sem-head,.sem-row{grid-template-columns:190px repeat(7,minmax(0,1fr));gap:6px;align-items:stretch}
  .sem-head{padding:12px 16px 8px;font-size:12px}
  .sem-head .esp{display:block}
  .sem-row{padding:8px 16px;align-items:center}
  .sem-nome{grid-column:auto;flex-direction:column;align-items:flex-start;gap:3px;margin:0}
  .cel{font-size:12px;padding:8px 4px 6px}
  .cel .e{flex-direction:row;gap:5px;justify-content:center;flex-wrap:wrap}
}
.nota-linha{font-size:13px;color:var(--tx2);margin:12px 4px 0}

/* todos os locais */
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--tx2);margin:6px 4px 12px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.filtro{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:14px}
.filtro[aria-pressed=true]{background:var(--acc-bg);box-shadow:0 0 0 1.5px var(--acc);color:#0561c2;font-weight:600}
.tl-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tl-row{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.tl-row.axis{border-top:0;padding-bottom:0;padding-top:12px}
.tl-nome{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-nome b{font-size:15px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.track{position:relative;height:36px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/14) 100%;border-radius:6px;background-color:#fafafc}
.blk{position:absolute;top:4px;bottom:4px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,#fff);box-shadow:inset 3px 0 0 var(--c);padding:0 6px 0 9px;font-size:11px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;cursor:pointer}
.ticks{position:relative;height:16px;font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span.p0{transform:none}.ticks span.p1{transform:translateX(-100%)}
@media(max-width:699px){.ticks span.dsk{display:none}}
@media(min-width:700px){
  .tl-row{grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:10px 20px}
  .tl-nome{flex-direction:column;align-items:flex-start;gap:4px}
}

/* configuração */
.cfg-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cfg-sub{display:flex;gap:4px}
.cfg-sub button{padding:7px 14px;border-radius:99px;font-size:14px;color:var(--tx2)}
.cfg-sub button[aria-selected=true]{background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--tx);font-weight:600}
.eq{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.eq:first-child{border-top:0}
.eq-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eq-top b{font-size:15px}
.todos{font-size:12px;color:var(--acc);padding:3px 10px;border-radius:99px;background:var(--acc-bg);font-weight:500}
.todos[aria-pressed=true]{background:var(--acc);color:#fff}
.eq-n{font-size:12px;color:var(--tx3);margin-left:auto}
.dias{display:flex;gap:6px}
.dias button{width:34px;height:34px;border-radius:50%;font-size:13px;font-weight:600;background:var(--bg);color:var(--tx3);display:grid;place-items:center;transition:background .12s}
.dias button[aria-pressed=true]{background:var(--c,var(--acc));color:#fff}
@media(min-width:700px){
  .eq{grid-template-columns:1fr auto;align-items:center;padding:12px 20px}
  .eq-n{margin-left:0;min-width:56px;text-align:right}
}
.eq-right{display:flex;align-items:center;gap:14px}
.pg{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.pg:first-child{border-top:0}
.pg-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pg-top b{font-size:15px}
.pg-top .h{font-variant-numeric:tabular-nums;color:var(--tx2);font-size:14px}
@media(min-width:700px){.pg{padding:14px 20px}}
.savebar{position:sticky;bottom:12px;margin-top:16px;display:flex;align-items:center;gap:12px;justify-content:space-between;background:rgba(29,29,31,.92);color:#fff;border-radius:16px;padding:10px 12px 10px 18px;z-index:5;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.savebar span{font-size:14px}
.savebar .btn{background:#48484a;color:#fff}
.savebar .btn.main{background:var(--acc)}
.savebar div{display:flex;gap:8px}

/* aviso */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:rgba(29,29,31,.94);color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:50;max-width:calc(100vw - 32px);transition:transform .25s,opacity .25s}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{color:#6cb6ff;font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <span class="brand">My ASA</span>
  <nav class="seg" role="tablist" aria-label="Telas do desenho" id="tabs"></nav>
</div></header>

<main class="wrap">
  <p class="demo">Desenho de exemplo · nomes e horários inventados · nada aqui grava no app</p>
  <section id="v-dia"></section>
  <section id="v-sem" hidden></section>
  <section id="v-loc" hidden></section>
  <section id="v-cfg" hidden></section>
</main>

<div class="scrim" id="scrim" data-act="fechar"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Detalhes da atividade"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ dados de mentira ============ */
const LOCAIS={
  snow:{nome:'Snowland',curto:'Snow',cor:'#2f7de1'},
  acqua:{nome:'Acquamotion',curto:'Acqua',cor:'#12a38f'},
  bella:{nome:'Bella',curto:'Bella',cor:'#e8742a'},
  buona:{nome:'Buona',curto:'Buona',cor:'#8a5bd1'},
  excl:{nome:'Exclusive',curto:'Exclusive',cor:'#d6417b'}
};
const CATS={
  show:{nome:'Show',cor:'#5e5ce6'},
  recep:{nome:'Recepção',cor:'#2fb36f'},
  ensaio:{nome:'Ensaio',cor:'#f0a30a'},
  camarim:{nome:'Camarim',cor:'#ff6482'},
  apoio:{nome:'Apoio',cor:'#9a9aa0'}
};
const TODOS=['Bia','Caio','Davi','Enzo','Gui','Júlia','Lara','Lia','Marina','Nina','Otto','Rafa','Sol','Theo'];
const DIAS_L=['S','T','Q','Q','S','S','D'];
const DIAS_N=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
const DIAS_C=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

const DIA={
  snow:[
    {id:1,ini:'08:30',fim:'09:00',nome:'Abertura e recepção',cat:'recep',p:['Lia','Theo']},
    {id:2,ini:'09:00',fim:'09:30',nome:'Boas-vindas',cat:'recep',p:['Nina','Rafa']},
    {id:3,ini:'10:00',fim:'10:40',nome:'Show Musical',cat:'show',p:['Marina','Davi','Caio','Bia','Júlia']},
    {id:4,ini:'10:30',fim:'11:30',nome:'Ensaio de formação',cat:'ensaio',p:['Marina','Júlia','Caio']},
    {id:5,ini:'12:00',fim:'13:00',nome:'Almoço em revezamento',cat:'apoio',p:['Lia','Theo','Nina']},
    {id:6,ini:'13:30',fim:'14:30',nome:'Fotos com personagens',cat:'recep',p:['Nina','Bia']},

/* ============ 3. todos os locais, um dia ============ */
function renderLoc(){
  const nomes=Object.keys(SAB).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const info=nomes.map(n=>{
    const b=[...sab(n)].sort((x,y)=>x[1]-y[1]);
    const locs=new Set(b.map(x=>x[0]));
    let gap=null;
    for(let i=1;i<b.length;i++)if(b[i][0]!==b[i-1][0]){const g=b[i][1]-b[i-1][2];gap=gap==null?g:Math.min(gap,g)}
    return {n,b,dois:locs.size>1,gap};
  });
  const nDois=info.filter(x=>x.dois).length,nApert=info.filter(x=>x.dois&&x.gap<1).length;
  let vis=info.filter(x=>!st.soDois||x.dois);
  vis=[...vis].sort((a,b)=>(b.dois-a.dois)||a.n.localeCompare(b.n,'pt-BR'));
  const ticks=[];for(let h=8;h<=22;h+=2)ticks.push(h);
  const tk=ticks.map((h,i)=>{
    const pos=(h-8)/14*100,cls=(h===8?' p0':h===22?' p1':''),soDesk=(h%4!==0&&h!==22)?' dsk':'';
    return `<span class="${soDesk}${cls}" style="left:${pos}%">${h}h</span>`;
  }).join('');
  const linhas=vis.map(x=>{
    const blocos=x.b.map(e=>{
      const [l,s,f]=e,fim=f==null?s+2:f,left=(s-8)/14*100,w=(fim-s)/14*100;
      return `<div class="blk" style="--c:${LOCAIS[l].cor};left:${left}%;width:${w}%" title="${LOCAIS[l].nome} ${rng(s,f)}">${LOCAIS[l].curto} ${rng(s,f)}</div>`;
    }).join('');
    const tags=(x.dois?'<span class="tag">2 locais</span>':'')+(x.dois&&x.gap<1?`<span class="tag bad">só ${Math.round(x.gap*60)} min para trocar</span>`:'');
    return `<div class="tl-row"><div class="tl-nome"><b>${esc(x.n)}</b>${tags}</div><div class="track">${blocos}</div></div>`;
  }).join('');
  const leg=Object.values(LOCAIS).map(l=>`<span><i style="--c:${l.cor}"></i>${l.nome}</span>`).join('');
  $('#v-loc').innerHTML=`<div class="hd"><h2>Todos os locais</h2><p>A linha do dia de cada pessoa, com os blocos na cor do local.</p></div>
    <div class="tl-bar">${dateNav()}<button class="filtro" data-act="soDois" aria-pressed="${st.soDois}">Só quem passa por 2 locais</button></div>
    <div class="legenda">${leg}</div>
    <div class="card"><div class="tl-row axis"><div></div><div class="ticks">${tk}</div></div>${linhas||'<div class="vazio-msg">Ninguém passa por dois locais neste dia.</div>'}</div>
    <p class="nota-linha">${nDois} ${nDois===1?'pessoa passa':'pessoas passam'} por dois locais${nApert?` · ${nApert} com pouco tempo para trocar`:''}.</p>`;
}

        ${chipsDias(d,`data-act="eqDia" data-n="${esc(n)}"`,L.cor)}</div>`;
    }).join('');
    corpo=`<div class="hd" style="margin-top:6px"><h2 style="font-size:18px">Equipe de ${L.nome}</h2><p>Toque nos dias em que a pessoa faz parte da equipe. É o único lugar onde isso se marca.</p></div>
      <div class="card">${linhas||'<div class="vazio-msg">Ninguém na equipe ainda.</div>'}</div>`;
  }else{
    const pg=draft.prog[st.cfgLocal];
    const linhas=pg.map((b,bi)=>{
      const t=b.d.filter(Boolean).length;
      return `<div class="pg"><div class="pg-top"><span class="dot" style="--c:${CATS[b.cat].cor}"></span><b>${esc(b.nome)}</b><span class="h">${b.h}</span><button class="todos" data-act="pgTodos" data-b="${bi}" aria-pressed="${t===7}">todos os dias</button></div>
        ${chipsDias(b.d,`data-act="pgDia" data-b="${bi}"`,CATS[b.cat].cor)}</div>`;
    }).join('');
    corpo=`<div class="hd" style="margin-top:6px"><h2 style="font-size:18px">Programação de ${L.nome}</h2><p>Temporada de fim de ano. Em quais dias cada atividade acontece.</p></div>
      <div class="card">${linhas}</div>
      <p class="nota-linha"><button class="link" data-act="novoBloco">+ Novo bloco</button></p>`;
  }
  const mudou=dirty();
  $('#v-cfg').innerHTML=`<div class="hd"><h2>Configuração</h2><p>Aqui se prepara a temporada. A escala do dia fica só com o que acontece no dia.</p></div>
    <div class="cfg-top"><div class="cfg-sub" role="tablist">
      <button role="tab" data-act="cfgSub" data-k="equipe" aria-selected="${st.cfgSub==='equipe'}">Equipe do local</button>
      <button role="tab" data-act="cfgSub" data-k="prog" aria-selected="${st.cfgSub==='prog'}">Programação da temporada</button></div></div>
    <div class="tl-bar" style="gap:6px;justify-content:flex-start;margin-bottom:14px">${locBtns}</div>
    ${corpo}
    ${mudou?`<div class="savebar"><span>Você mudou a configuração</span><div><button class="btn" data-act="cfgCancelar">Cancelar</button><button class="btn main" data-act="cfgSalvar">Salvar</button></div></div>`:''}`;
}

/* ============ render geral ============ */
function renderAll(){
  renderTabs();
  if(st.tab==='dia')renderDia();
  if(st.tab==='sem')renderSem();
  if(st.tab==='loc')renderLoc();
  if(st.tab==='cfg')renderCfg();
  if(st.tab!=='dia'&&st.sel!=null){st.sel=null}
  renderPanel();
}

/* ============ cliques ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(st.pop&&!e.target.closest('.pop-wrap')){st.pop=false;if(st.tab==='dia')renderDia()}
  if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  switch(a){
    case 'tab':st.tab=d.k;st.pop=false;renderAll();window.scrollTo(0,0);break;
    case 'popLocal':st.pop=!st.pop;renderDia();break;
    case 'local':st.local=d.k;st.pop=false;st.resumo=false;st.status='rascunho';st.sel=null;renderDia();renderPanel();break;
    case 'dia':st.off+=Number(d.d);renderAll();break;
    case 'resumo':st.resumo=!st.resumo;renderDia();break;
    case 'porPessoa':st.porPessoa=!st.porPessoa;renderDia();break;
    case 'publicar':
      st.publicando=true;renderDia();
      setTimeout(()=>{st.publicando=false;st.status='publicada';renderDia();toast('Escala de '+LOCAIS[st.local].nome+' publicada (exemplo). O elenco já vê.')},900);break;
    case 'abrir':abrir(Number(d.id));break;
    case 'fechar':fechar();break;
    case 'modo':{
      st.modo=d.m;
      if(d.m==='ajustar')st.draft=new Set(achaAct().p);
      renderPanel();break;}
    case 'adjTog':st.draft.has(d.n)?st.draft.delete(d.n):st.draft.add(d.n);renderPanel();break;
    case 'adjSalvar':{
      const x=achaAct();x.p=TODOS.filter(n=>st.draft.has(n));
      tocouNaEscala();st.modo='menu';renderDia();renderPanel();toast('Pessoas ajustadas (exemplo).');break;}
    case 'horSalvar':{
      const x=achaAct(),i=$('#hIni').value,f=$('#hFim').value;
      if(!i||!f||tn(f)<=tn(i)){toast('O fim precisa ser depois do começo.');break}
      x.ini=i;x.fim=f;DIA[st.local].sort((p,q)=>tn(p.ini)-tn(q.ini));
      tocouNaEscala();st.modo='menu';renderDia();renderPanel();toast('Horário mudado só neste dia (exemplo).');break;}
    case 'editarDia':toast('No app de verdade, abriria o editor só deste dia.');break;
    case 'tirar':{
      const lista=DIA[st.local],idx=lista.findIndex(x=>x.id===st.sel),item=lista.splice(idx,1)[0];
      const antes=st.status;tocouNaEscala();st.sel=null;renderDia();renderPanel();
      toast('“'+item.nome+'” saiu deste dia.','Desfazer',()=>{lista.splice(idx,0,item);st.status=antes;renderDia()});break;}
    case 'soDois':st.soDois=!st.soDois;renderLoc();break;
    case 'cfgLocal':st.cfgLocal=d.k;renderCfg();break;
    case 'cfgSub':st.cfgSub=d.k;renderCfg();break;
    case 'eqDia':{const arr=draft.eq[st.cfgLocal][d.n];arr[d.i]=arr[d.i]?0:1;renderCfg();break;}
    case 'eqTodos':{const arr=draft.eq[st.cfgLocal][d.n],tudo=arr.every(Boolean);arr.fill(tudo?0:1);renderCfg();break;}
    case 'pgDia':{const arr=draft.prog[st.cfgLocal][d.b].d;arr[d.i]=arr[d.i]?0:1;renderCfg();break;}
    case 'pgTodos':{const arr=draft.prog[st.cfgLocal][d.b].d,tudo=arr.every(Boolean);arr.fill(tudo?0:1);renderCfg();break;}
    case 'novoBloco':toast('No app de verdade, abriria uma janela com Cancelar e Salvar.');break;
    case 'cfgCancelar':draft=clone(saved);renderCfg();break;
    case 'cfgSalvar':saved=clone(draft);renderCfg();toast('Configuração salva (exemplo).');break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(st.pop){st.pop=false;renderDia();return}
  if(st.sel!=null)fechar();
});

renderAll();
</script>
</body>
</html>
